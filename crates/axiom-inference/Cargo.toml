[package]
name = "axiom-inference"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait.workspace = true
futures-util = "0.3"
bytes = "1"

# ONNX Runtime (optional, for Windows ARM64 NPU and CPU inference)
ort = { version = "=2.0.0-rc.12", optional = true }

# llama.cpp (optional, for bundled local GGUF model inference)
llama-cpp-2 = { version = "0.1", optional = true, default-features = false }
sha2 = { version = "0.10", optional = true }
indicatif = { version = "0.17", optional = true }
num_cpus = "1.0"

[features]
default = []
onnx = ["dep:ort"]
llama-cpp = ["dep:llama-cpp-2", "dep:sha2", "dep:indicatif"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }