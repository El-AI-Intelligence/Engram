[package]
name = "axiom-engram"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
async-trait = "0.1"
argon2 = "0.5"
parking_lot = "0.12"
tracing.workspace = true

# ONNX Runtime for zero-config local embeddings (all-MiniLM-L6-v2, 384-dim)
# Candle: pure-Rust ML framework for zero-config BERT embeddings
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
# HuggingFace tokenizer for BERT-compatible model tokenization
tokenizers = { version = "0.21", optional = true }
# Model download from HuggingFace Hub
hf-hub = { version = "0.4", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["full"] }

[features]
default = []
onnx-embed = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]

# Windows: see crates/engramd/Cargo.toml — vendored OpenSSL so bundled
# SQLCipher builds on MSVC without a system OpenSSL install.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher", "bundled-sqlcipher-vendored-openssl"] }