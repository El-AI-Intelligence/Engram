[package]
name = "engramd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "engramd"
path = "src/main.rs"

[[bin]]
name = "engram"
path = "src/bin/engram.rs"

[dependencies]
# Workspace
axiom-engram = { path = "../axiom-engram", version = "0.1.0", features = ["onnx-embed"] }
axiom-inference = { path = "../axiom-inference", version = "0.1.0" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# HTTP server (versions from existing lockfile)
axum = { version = "0.8", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Async
futures = "0.3"
tokio-stream = "0.1"

# Database (used directly by route handlers for app-level queries; matches axiom-engram)
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Sync client (E2E encrypted cloud sync)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
argon2 = "0.5"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
uuid = { version = "1", features = ["v4"] }
