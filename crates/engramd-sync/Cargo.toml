[package]
name = "engramd-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Workspace
axiom-engram = { path = "../axiom-engram", version = "0.1.0" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Database
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Accounts (WebAuthn passkeys)
webauthn-rs = { version = "0.5.5", features = ["resident-key-support", "workaround-google-passkey-specific-issues"] }
webauthn-rs-proto = "0.5.5"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"

# Server-side password hashing (Argon2id). Distinct params + salt from the
# CLIENT-side wrap derivation so the stored hash yields no wrap key material.
argon2 = "0.5"

# Optional SMTP for password-reset emails (operator CLI fallback otherwise)
lettre = "0.11"
