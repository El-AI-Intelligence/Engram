# Engram Memory Vault — nginx reverse proxy
# Drop into /etc/nginx/sites-available/engram.ellmstack.dev
# then: ln -s /etc/nginx/sites-available/engram.ellmstack.dev /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

server {
    server_name engram.ellmstack.dev;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # certbot will add SSL config here
}
