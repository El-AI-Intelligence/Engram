# TEMPORARY — Windows-only test gate for fast release-CI iteration.
# Mirrors the release workflow's test-windows job so the fix can be
# validated in ~20 min instead of a full ~1.5h release run. Delete once
# v0.1.1's Windows tests are verified green.
name: WinTest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-windows:
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # bundled-sqlcipher-vendored-openssl compiles OpenSSL from source,
      # which needs NASM on Windows MSVC (Perl is preinstalled on the image).
      - name: Install NASM
        run: choco install nasm -y --no-progress

      - name: Run tests
        run: cargo test -p axiom-engram -p engramd -p engramd-mcp
