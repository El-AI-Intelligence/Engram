# ── Engram Release Workflow ──────────────────────────────────────────────────
#
# Triggered by pushing a version tag (e.g., v0.2.0).
# Builds binaries for all platforms, creates GitHub Release, pushes Docker
# image, and publishes to crates.io.
#
# macOS binaries are signed + notarized with a Developer ID Application
# certificate when the APPLE_* secrets are present; when absent the build
# ships unsigned with a warning (by design — never blocks a release).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.2.0)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  # ── Run tests ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test -p axiom-engram -p engramd -p engramd-sync -p engramd-mcp

  # First Windows/macOS compile gate — runs at release time, not before the
  # first Windows/macOS build ever happens. (engramd-sync is deliberately
  # excluded: it is Linux-only — webauthn-rs-core links OpenSSL via
  # openssl-sys, and the relay is only deployed on Linux.)
  test-windows:
    name: Test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # bundled-sqlcipher-vendored-openssl compiles OpenSSL from source,
      # which needs NASM on Windows MSVC (Perl is preinstalled on the image).
      - name: Install NASM
        run: choco install nasm -y --no-progress

      - name: Run tests
        run: cargo test -p axiom-engram -p engramd -p engramd-mcp

  test-macos:
    name: Test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test -p axiom-engram -p engramd -p engramd-mcp

  # ── Build binaries for all platforms ─────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [test, test-windows]
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: engramd-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: engramd-linux-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: engramd-darwin-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: engramd-darwin-arm64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: engramd-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          # The runner image proxies apt through GitHub's Azure cache
          # (security.ubuntu.com resolves to 52.252.75.106) and that cache
          # 404s EVERY binary-arm64 index file — deterministic, not a flake.
          # Bypass it: drop the /etc/hosts mirror entries and replace the
          # sources with the real Ubuntu archives. NOTE: arm64 is a PORT
          # architecture — its Packages live on ports.ubuntu.com, not on
          # archive.ubuntu.com/security.ubuntu.com (those 404 binary-arm64
          # for real). Constrain each source to the arch it actually serves.
          sudo sed -i -e '/security\.ubuntu\.com/d' -e '/archive\.ubuntu\.com/d' /etc/hosts
          sudo rm -f /etc/apt/apt-mirrors.txt /etc/apt/sources.list
          sudo bash -c 'cat > /etc/apt/sources.list.d/ubuntu.sources <<EOF
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main universe restricted multiverse
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-backports noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF'
          sudo dpkg --add-architecture arm64
          # The network can still genuinely flake; retry a few times, then
          # one hard attempt that fails the step if archives are unreachable.
          for i in 1 2 3 4 5; do
            sudo apt-get update && break
            echo "apt update attempt $i failed — retrying in 15s"
            sleep 15
          done
          sudo apt-get update
          # g++ too: esaxx-rs (tokenizer) compiles C++ and needs
          # aarch64-linux-gnu-g++, not just the C cross-compiler.
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libssl-dev:arm64
          # openssl-sys (via reqwest/hf-hub native-tls) must find an aarch64
          # OpenSSL; without these env vars pkg-config refuses cross builds.
          echo "PKG_CONFIG_ALLOW_CROSS=1" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"
          # lto=true in the release profile makes rustc drive its own lld
          # through the target's default "cc" linker; for the cross target
          # that resolves to the HOST x86_64 gcc, which runs lld without
          # aarch64 emulation ("incompatible with elf64-x86-64"). Point the
          # linker at the real cross gcc so lld gets the right emulation.
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install NASM (Windows — vendored OpenSSL build)
        if: matrix.os == 'windows-latest'
        run: choco install nasm -y --no-progress

      - name: Build
        run: cargo build --release -p engramd -p engramd-mcp --target ${{ matrix.target }}

      # ── Package: unix (unsigned or pre-signing) ───────────────────────────
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/engram dist/
          cp target/${{ matrix.target }}/release/engramd dist/
          cp target/${{ matrix.target }}/release/engramd-mcp dist/
          tar czf ${{ matrix.artifact }} -C dist engram engramd engramd-mcp
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      # ── Package: windows (PowerShell — bash-isms don't exist here) ────────
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item "target/${{ matrix.target }}/release/engram.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/engramd.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/engramd-mcp.exe" dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact }}" -Force
          $h = (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact }}").Hash.ToLower()
          Set-Content -Path "${{ matrix.artifact }}.sha256" -Value "$h  ${{ matrix.artifact }}"

      # ── macOS: codesign + notarize + staple (secrets-guarded) ────────────
      - name: Import Apple signing certificate
        if: matrix.os == 'macos-latest' && env.APPLE_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/engram-codesign.keychain-db"
          security create-keychain -p "ephemeral" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "ephemeral" "$KEYCHAIN"
          # codesign resolves KEY items through the user search list on
          # newer macOS: a keychain passed only via --keychain yields
          # "<hash>: no identity found" even though find-identity lists
          # the identity in it. Add to the search list and make default.
          security list-keychains -d user -s "$KEYCHAIN" "$(security list-keychains -d user | sed 's/\"//g')"
          security default-keychain -d user -s "$KEYCHAIN"
          security unlock-keychain -p "ephemeral" "$KEYCHAIN"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/engram-cert.p12"
          # -T only for codesign: /usr/bin/notarytool no longer exists on the
          # runner image (notarytool is invoked via xcrun), and security
          # import fails hard on a missing -T path.
          if security import "$RUNNER_TEMP/engram-cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" -A -T /usr/bin/codesign; then
            echo "p12 imported directly"
          else
            # Some p12 encodings trip Apple's importer with a bogus "MAC
            # verification failed (wrong password?)" even when the password
            # is right. Fall back: split to PEM with openssl and re-pack as
            # a legacy-algorithm p12, which the importer always accepts.
            echo "p12 import failed — falling back to legacy re-pack"
            openssl pkcs12 -in "$RUNNER_TEMP/engram-cert.p12" -passin "env:APPLE_CERT_PASSWORD" \
              -clcerts -nokeys -out "$RUNNER_TEMP/engram-cert.pem"
            openssl pkcs12 -in "$RUNNER_TEMP/engram-cert.p12" -passin "env:APPLE_CERT_PASSWORD" \
              -nocerts -nodes -out "$RUNNER_TEMP/engram-key.pem"
            openssl pkcs12 -export -legacy -macalg sha1 \
              -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES \
              -inkey "$RUNNER_TEMP/engram-key.pem" -in "$RUNNER_TEMP/engram-cert.pem" \
              -out "$RUNNER_TEMP/engram-cert-legacy.p12" -passout "pass:legacy"
            security import "$RUNNER_TEMP/engram-cert-legacy.p12" -k "$KEYCHAIN" -P "legacy" -A -T /usr/bin/codesign
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "ephemeral" "$KEYCHAIN"
          echo "CODESIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Codesign binaries
        if: matrix.os == 'macos-latest' && env.APPLE_CERT_P12_BASE64 != ''
        run: |
          echo "=== all identities in keychain ==="
          security find-identity "$CODESIGN_KEYCHAIN" || true
          echo "=== codesigning identities ==="
          security find-identity -p codesigning "$CODESIGN_KEYCHAIN" || true
          # No -v: the validity filter has been observed to drop a freshly
          # imported Developer ID G2 identity on the runner image even
          # though codesign and notarytool accept it fine.
          IDENTITY=$(security find-identity -p codesigning "$CODESIGN_KEYCHAIN" | awk '/Developer ID Application/ {print $2; exit}')
          codesign --force --options runtime --timestamp --sign "$IDENTITY" --keychain "$CODESIGN_KEYCHAIN" \
            target/${{ matrix.target }}/release/engram target/${{ matrix.target }}/release/engramd
          codesign --verify --strict --verbose=2 target/${{ matrix.target }}/release/engramd

      - name: Notarize + staple + repackage
        if: matrix.os == 'macos-latest' && env.APPLE_CERT_P12_BASE64 != ''
        run: |
          rm -rf dist notary.zip staged
          mkdir -p dist
          cp target/${{ matrix.target }}/release/engram dist/
          cp target/${{ matrix.target }}/release/engramd dist/
          cp target/${{ matrix.target }}/release/engramd-mcp dist/
          ditto -c -k --keepParent dist notary.zip
          xcrun notarytool submit notary.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          mkdir -p staged
          ditto -x -k notary.zip staged/
          xcrun stapler staple staged/dist/engram staged/dist/engramd
          xcrun stapler validate staged/dist/engramd
          tar czf ${{ matrix.artifact }} -C staged/dist engram engramd engramd-mcp
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Warn when shipping unsigned macOS binaries
        if: matrix.os == 'macos-latest' && env.APPLE_CERT_P12_BASE64 == ''
        run: |
          echo "::warning::Apple signing secrets absent — darwin binaries shipped UNSIGNED. Gatekeeper will block first launch; users must right-click → Open or run 'xattr -dr com.apple.quarantine <binary>'."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}*

  # ── GitHub Release ──────────────────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Docker image (multi-arch manifest) ──────────────────────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/engramd:latest
            ghcr.io/${{ github.repository_owner }}/engramd:${{ github.ref_name }}

  # ── Publish to crates.io ────────────────────────────────────────────────
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [build, release]
    if: github.ref_type == 'tag'
    env:
      # Publishing is optional: without a CRATES_IO_TOKEN secret the steps
      # below no-op. (secrets can't be referenced in a job-level `if` —
      # that makes the whole workflow fail to evaluate — so surface it as
      # env and gate each step.)
      HAS_CRATES_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}

    steps:
      - name: Skip (no crates.io token)
        if: env.HAS_CRATES_TOKEN != 'true'
        run: echo "CRATES_IO_TOKEN secret not set — skipping crates.io publish."

      - uses: actions/checkout@v4
        if: env.HAS_CRATES_TOKEN == 'true'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        if: env.HAS_CRATES_TOKEN == 'true'

      - name: Publish axiom-engram
        if: env.HAS_CRATES_TOKEN == 'true'
        run: cargo publish -p axiom-engram --token ${{ secrets.CRATES_IO_TOKEN }}

      - name: Publish engramd
        if: env.HAS_CRATES_TOKEN == 'true'
        run: cargo publish -p engramd --token ${{ secrets.CRATES_IO_TOKEN }}
