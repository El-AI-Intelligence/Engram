[workspace]
members = [
    "crates/axiom-engram",
    "crates/axiom-inference",
    "crates/engramd",
    "crates/engramd-sync",
    "crates/engramd-mcp",
]

default-members = [
    "crates/axiom-engram",
    "crates/axiom-inference",
    "crates/engramd",
    "crates/engramd-sync",
    "crates/engramd-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
description = "Engram Memory Vault — your AI deserves a memory."
authors = ["El-AI-Intelligence"]
license = "MIT"
repository = "https://github.com/El-AI-Intelligence/engram"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
validator = { version = "0.19", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
