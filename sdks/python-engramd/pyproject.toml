[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "engramd"
version = "0.1.0"
description = "Python client for the Engram by El AI Intelligence"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "sseclient-py>=1.8",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[project.scripts]
engramd-mcp = "engramd.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/engramd"]
